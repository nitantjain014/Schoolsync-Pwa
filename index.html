<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <title>SchoolSync</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MIUI-style carousel backdrop -->
    <div id="backdropCarousel" class="backdrop-carousel">
        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <!-- Images loaded dynamically -->
            </div>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <!-- Active backdrop overlay -->
    <div id="activeBackdrop" class="active-backdrop" style="background-image: url('bg4.jpg')"></div>

    <!-- Main app container -->
    <div class="app-container">
        <!-- Header -->
        <div class="header glass-surface">
            <div class="header-content">
                <h1 id="appTitle">Today</h1>
                <button id="settingsBtn" class="settings-btn" aria-label="Settings">⚙️</button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav glass-surface">
            <button class="tab-btn active" data-tab="today">📅 Today</button>
            <button class="tab-btn" data-tab="todo">✓ To-Do</button>
            <button class="tab-btn" data-tab="timer">⏱️ Timer</button>
            <button class="tab-btn" data-tab="notes">📝 Notes</button>
            <button class="tab-btn" data-tab="marks">📊 Marks</button>
            <button class="tab-btn" data-tab="chat">💬 Chat</button>
        </div>

        <!-- Content area -->
        <div class="content-area">
            <!-- TODAY TAB -->
            <div class="tab-content active" id="today-tab">
                <div class="calendar-container glass-surface">
                    <div class="calendar-header">
                        <button id="prevMonth">&lt;</button>
                        <h2 id="monthYear"></h2>
                        <button id="nextMonth">&gt;</button>
                    </div>
                    <div class="weekdays">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
                        <div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
                <div class="today-tasks-preview glass-surface">
                    <h3>Today's Tasks</h3>
                    <div id="todayTasksList"></div>
                </div>
            </div>

            <!-- TO-DO TAB -->
            <div class="tab-content" id="todo-tab">
                <div class="todo-header glass-surface">
                    <button class="add-btn">+ Add Task</button>
                </div>
                <div class="filter-buttons glass-surface">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="urgent">Urgent</button>
                    <button class="filter-btn" data-filter="high">High</button>
                    <button class="filter-btn" data-filter="normal">Normal</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>

            <!-- TIMER TAB -->
            <div class="tab-content" id="timer-tab">
                <div class="timer-container glass-surface">
                    <div class="timer-header">
                        <label for="subjectSelect">Subject:</label>
                        <select id="subjectSelect" class="timer-subject-select">
                            <option value="">Select Subject</option>
                            <option value="English">English</option>
                            <option value="Maths">Maths</option>
                            <option value="Science">Science</option>
                            <option value="Social Studies">Social Studies</option>
                            <option value="Hindi">Hindi</option>
                            <option value="Sanskrit">Sanskrit</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                    <div class="timer-progress">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="timer-input">
                        <input type="number" id="hoursInput" placeholder="H" min="0" max="23">
                        <input type="number" id="minutesInput" placeholder="M" min="0" max="59">
                        <input type="number" id="secondsInput" placeholder="S" min="0" max="59">
                    </div>
                    <button class="timer-btn" id="timerToggleBtn">Start</button>
                </div>
            </div>

            <!-- NOTES TAB -->
            <div class="tab-content" id="notes-tab">
                <div class="notes-header glass-surface">
                    <button class="add-btn">+ New Note</button>
                </div>
                <div class="notes-list" id="notesList"></div>
                <div class="note-editor glass-surface" id="noteEditor" style="display:none;">
                    <textarea id="noteText" placeholder="Take a note..."></textarea>
                    <button id="saveNoteBtn">Save</button>
                </div>
            </div>

            <!-- MARKS TAB -->
            <div class="tab-content" id="marks-tab">
                <div class="marks-header glass-surface">
                    <button class="add-btn">+ Add Score</button>
                </div>
                <div class="marks-stats glass-surface">
                    <div class="stat-item">
                        <span class="stat-label">Average</span>
                        <span class="stat-value" id="averageScore">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Highest</span>
                        <span class="stat-value" id="highestScore">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Tests</span>
                        <span class="stat-value" id="totalTests">0</span>
                    </div>
                </div>
                <div class="marks-performance glass-surface">
                    <h3>Performance</h3>
                    <div id="performanceBars"></div>
                </div>
                <div class="marks-history glass-surface">
                    <h3>Score History</h3>
                    <div id="marksHistory"></div>
                </div>
            </div>

            <!-- CHAT TAB -->
            <div class="tab-content" id="chat-tab">
                <div class="chat-container glass-surface">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Ask something..." class="chat-input">
                        <button id="chatSendBtn" class="chat-send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom navigation -->
        <nav class="bottom-nav glass-surface">
            <button class="nav-btn active" data-tab="today">📅</button>
            <button class="nav-btn" data-tab="todo">✓</button>
            <button class="nav-btn" data-tab="timer">⏱️</button>
            <button class="nav-btn" data-tab="notes">📝</button>
            <button class="nav-btn" data-tab="marks">📊</button>
            <button class="nav-btn" data-tab="chat">💬</button>
        </nav>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content glass-surface">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label for="themeToggle">Dark Theme</label>
                    <input type="checkbox" id="themeToggle" class="toggle-switch">
                </div>
                <div class="setting-item">
                    <label for="autoRotateToggle">Auto-rotate Backdrops</label>
                    <input type="checkbox" id="autoRotateToggle" class="toggle-switch" checked>
                </div>
                <div class="setting-item">
                    <h3>Backdrop Preview</h3>
                    <div class="backdrop-preview-grid" id="backdropPreview"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Task/Score Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content glass-surface">
            <div class="modal-header">
                <h2 id="addModalTitle">Add Task</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="addModalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
